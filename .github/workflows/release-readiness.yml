# Manual, read-only release-readiness check. It validates release/RELEASE-GATES.json and FAILS while any gate required for the chosen
# target is not PASS. It is expected to fail until the human decisions are recorded in that file. It does not build, publish, tag,
# release, deploy or upload anything, and it cannot authorize any of those actions.
name: release-readiness

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target to check (the script rejects any other value)
        required: true
        type: choice
        options:
          - private-remote-backup
          - public-source-release
          - versioned-release
          - production

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: Strict release-gate check (fails while any required gate is unresolved)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the release gates for the chosen target
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: node scripts/release/check-gates.mjs --target "$RELEASE_TARGET"
